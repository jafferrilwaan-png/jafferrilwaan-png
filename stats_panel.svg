<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 120" width="860" height="120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06080D"/>
      <stop offset="100%" stop-color="#0a0d1a"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#C084FC" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Card -->
  <rect width="860" height="120" rx="14" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="1" y="1" width="858" height="118" rx="13" fill="none" stroke="#C084FC" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Section: Stats left -->
  <text x="30" y="22" font-family="'Courier New',monospace" font-size="9" fill="#94A3B8">◉ LIVE ENGINEERING STATS</text>

  <!-- Stat boxes -->
  <!-- Box 1 -->
  <rect x="20" y="30" width="120" height="72" rx="8" fill="#0d1020"/>
  <rect x="20" y="30" width="120" height="72" rx="8" fill="none" stroke="#C084FC" stroke-width="0.8" opacity="0.5"/>
  <text x="80" y="58" font-family="'Courier New',monospace" font-size="22" fill="#C084FC" text-anchor="middle" font-weight="bold" filter="url(#glow)">4,609</text>
  <text x="80" y="74" font-family="'Courier New',monospace" font-size="8" fill="#64748B" text-anchor="middle">CONTRIBUTIONS</text>
  <text x="80" y="88" font-family="'Courier New',monospace" font-size="7" fill="#475569" text-anchor="middle">Mar 15 — Present</text>

  <!-- Box 2 -->
  <rect x="155" y="30" width="100" height="72" rx="8" fill="#0d1020"/>
  <rect x="155" y="30" width="100" height="72" rx="8" fill="none" stroke="#22D3EE" stroke-width="0.8" opacity="0.5"/>
  <text x="205" y="60" font-family="'Courier New',monospace" font-size="28" fill="#22D3EE" text-anchor="middle" font-weight="bold" filter="url(#glow)">5🔥</text>
  <text x="205" y="76" font-family="'Courier New',monospace" font-size="8" fill="#64748B" text-anchor="middle">CUR. STREAK</text>
  <text x="205" y="90" font-family="'Courier New',monospace" font-size="7" fill="#475569" text-anchor="middle">Aug 28–Sep 1</text>

  <!-- Box 3 -->
  <rect x="268" y="30" width="100" height="72" rx="8" fill="#0d1020"/>
  <rect x="268" y="30" width="100" height="72" rx="8" fill="none" stroke="#F59E0B" stroke-width="0.8" opacity="0.5"/>
  <text x="318" y="60" font-family="'Courier New',monospace" font-size="28" fill="#F59E0B" text-anchor="middle" font-weight="bold" filter="url(#glow)">14</text>
  <text x="318" y="76" font-family="'Courier New',monospace" font-size="8" fill="#64748B" text-anchor="middle">BEST STREAK</text>
  <text x="318" y="90" font-family="'Courier New',monospace" font-size="7" fill="#475569" text-anchor="middle">Jul 12–Jul 25</text>

  <!-- Divider -->
  <line x1="385" y1="25" x2="385" y2="108" stroke="#1e293b" stroke-width="1"/>

  <!-- Language bars section -->
  <text x="400" y="22" font-family="'Courier New',monospace" font-size="9" fill="#94A3B8">◉ LANGUAGE ARSENAL</text>

  <!-- TypeScript -->
  <text x="400" y="40" font-family="'Courier New',monospace" font-size="9" fill="#C084FC">TypeScript</text>
  <rect x="480" y="31" width="200" height="8" rx="4" fill="#1e293b"/>
  <rect x="480" y="31" width="0" height="8" rx="4" fill="url(#bar1)" filter="url(#glow)">
    <animate attributeName="width" values="0;168" dur="1.5s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="690" y="40" font-family="'Courier New',monospace" font-size="8" fill="#C084FC">84%</text>

  <!-- JavaScript -->
  <text x="400" y="57" font-family="'Courier New',monospace" font-size="9" fill="#22D3EE">JavaScript</text>
  <rect x="480" y="48" width="200" height="8" rx="4" fill="#1e293b"/>
  <rect x="480" y="48" width="0" height="8" rx="4" fill="url(#bar2)" filter="url(#glow)">
    <animate attributeName="width" values="0;140" dur="1.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="690" y="57" font-family="'Courier New',monospace" font-size="8" fill="#22D3EE">70%</text>

  <!-- Python / C -->
  <text x="400" y="74" font-family="'Courier New',monospace" font-size="9" fill="#34D399">Python / C</text>
  <rect x="480" y="65" width="200" height="8" rx="4" fill="#1e293b"/>
  <rect x="480" y="65" width="0" height="8" rx="4" fill="url(#bar3)" filter="url(#glow)">
    <animate attributeName="width" values="0;100" dur="2.1s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="690" y="74" font-family="'Courier New',monospace" font-size="8" fill="#34D399">50%</text>

  <!-- C++ Firmware -->
  <text x="400" y="91" font-family="'Courier New',monospace" font-size="9" fill="#F59E0B">C++ Firmware</text>
  <rect x="480" y="82" width="200" height="8" rx="4" fill="#1e293b"/>
  <rect x="480" y="82" width="0" height="8" rx="4" fill="url(#bar4)" filter="url(#glow)">
    <animate attributeName="width" values="0;72" dur="2.4s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="690" y="91" font-family="'Courier New',monospace" font-size="8" fill="#F59E0B">36%</text>

  <!-- Live ping dot -->
  <circle cx="840" cy="20" r="4" fill="#22C55E" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;6;4" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="820" y="23" font-family="'Courier New',monospace" font-size="7" fill="#22C55E" text-anchor="end">LIVE</text>
</svg>
