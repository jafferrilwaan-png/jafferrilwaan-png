<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 110" width="860" height="110">
  <defs>
    <linearGradient id="hudBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#090E24"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Card -->
  <rect width="860" height="110" rx="10" fill="url(#hudBg)" stroke="#22D3EE" stroke-width="1" opacity="0.9"/>

  <!-- Left Tactical Radar Ping -->
  <g transform="translate(60, 55)">
    <circle cx="0" cy="0" r="38" fill="none" stroke="#22D3EE" stroke-width="0.8" opacity="0.3"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#22D3EE" stroke-width="0.8" opacity="0.5"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#C084FC" stroke-width="0.8" opacity="0.7"/>
    <circle cx="0" cy="0" r="3" fill="#22C55E" filter="url(#neon)"/>
    <!-- Radar Sweep Needle -->
    <line x1="0" y1="0" x2="28" y2="-24" stroke="#22D3EE" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Header Text -->
  <text x="125" y="32" font-family="'Courier New', monospace" font-size="11" fill="#22D3EE" font-weight="bold" letter-spacing="2">
    ◉ TACTICAL DEPLOYMENT ARRAY // 7 ACTIVE SYSTEMS
  </text>
  <text x="125" y="48" font-family="'Courier New', monospace" font-size="8.5" fill="#94A3B8">
    TELEMETRY SYNCED • SENSOR DSP PIPELINES • AUTONOMOUS RESCUE &amp; ASSISTIVE NODES
  </text>

  <!-- 7 Project Pulse Badges -->
  <g transform="translate(125, 62)">
    <!-- 1. AURA -->
    <rect x="0" y="0" width="88" height="26" rx="5" fill="#0D142D" stroke="#22D3EE" stroke-width="0.8"/>
    <circle cx="10" cy="13" r="3" fill="#22D3EE"/>
    <text x="18" y="17" font-family="'Courier New', monospace" font-size="8.5" fill="#22D3EE" font-weight="bold">A.U.R.A</text>

    <!-- 2. AXON -->
    <rect x="96" y="0" width="80" height="26" rx="5" fill="#0D142D" stroke="#C084FC" stroke-width="0.8"/>
    <circle cx="106" cy="13" r="3" fill="#C084FC"/>
    <text x="114" y="17" font-family="'Courier New', monospace" font-size="8.5" fill="#C084FC" font-weight="bold">AXON</text>

    <!-- 3. AGNI -->
    <rect x="184" y="0" width="112" height="26" rx="5" fill="#0D142D" stroke="#F59E0B" stroke-width="0.8"/>
    <circle cx="194" cy="13" r="3" fill="#F59E0B"/>
    <text x="202" y="17" font-family="'Courier New', monospace" font-size="8.5" fill="#F59E0B" font-weight="bold">AGNI PARAVAI</text>

    <!-- 4. SILENT VOICE -->
    <rect x="304" y="0" width="114" height="26" rx="5" fill="#0D142D" stroke="#38BDF8" stroke-width="0.8"/>
    <circle cx="314" cy="13" r="3" fill="#38BDF8"/>
    <text x="322" y="17" font-family="'Courier New', monospace" font-size="8.5" fill="#38BDF8" font-weight="bold">SILENT VOICE</text>

    <!-- 5. CGPA -->
    <rect x="426" y="0" width="88" height="26" rx="5" fill="#0D142D" stroke="#10B981" stroke-width="0.8"/>
    <circle cx="436" cy="13" r="3" fill="#10B981"/>
    <text x="444" y="17" font-family="'Courier New', monospace" font-size="8.5" fill="#10B981" font-weight="bold">CGPA CALC</text>

    <!-- 6. FREEDOM BRIDGE -->
    <rect x="522" y="0" width="118" height="26" rx="5" fill="#0D142D" stroke="#A78BFA" stroke-width="0.8"/>
    <circle cx="532" cy="13" r="3" fill="#A78BFA"/>
    <text x="540" y="17" font-family="'Courier New', monospace" font-size="8.5" fill="#A78BFA" font-weight="bold">FREEDOM BRIDGE</text>

    <!-- 7. EXTENDED -->
    <rect x="648" y="0" width="62" height="26" rx="5" fill="#0D142D" stroke="#FCD34D" stroke-width="0.8"/>
    <circle cx="658" cy="13" r="3" fill="#FCD34D"/>
    <text x="666" y="17" font-family="'Courier New', monospace" font-size="8.5" fill="#FCD34D" font-weight="bold">+EXT</text>
  </g>

  <!-- Live Status Pulse -->
  <g transform="translate(805, 30)">
    <circle cx="0" cy="0" r="4" fill="#22C55E">
      <animate attributeName="r" values="3;6;3" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="-12" y="18" font-family="'Courier New', monospace" font-size="7.5" fill="#22C55E" text-anchor="middle">ONLINE</text>
  </g>
</svg>
