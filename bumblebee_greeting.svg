<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- Sci-fi Gradients -->
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="darkArmor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Sci-Fi Halo Background -->
  <circle cx="120" cy="120" r="105" fill="#060913" stroke="#1E293B" stroke-width="2"/>
  <circle cx="120" cy="120" r="100" fill="none" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" from="0 120 120" to="360 120 120" dur="20s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="120" r="92" fill="none" stroke="#C084FC" stroke-width="1" stroke-dasharray="12 8" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" from="360 120 120" to="0 120 120" dur="25s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating Body & Head Group -->
  <g id="bumblebee-body">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="2.4s" repeatCount="indefinite" ease="ease-in-out"/>

    <!-- Upper Torso / Chassis -->
    <path d="M75,145 L165,145 L155,195 L85,195 Z" fill="url(#darkArmor)" stroke="#334155" stroke-width="2"/>
    <!-- Yellow Chest Armor Plating -->
    <path d="M80,148 L115,148 L110,185 L85,185 Z" fill="url(#goldPlate)"/>
    <path d="M125,148 L160,148 L155,185 L130,185 Z" fill="url(#goldPlate)"/>
    <polygon points="113,158 127,158 120,172" fill="#22D3EE" filter="url(#neon)"/>

    <!-- Neck Assembly -->
    <rect x="110" y="132" width="20" height="15" rx="3" fill="#334155"/>

    <!-- Helmet / Head Base -->
    <path d="M85,100 L155,100 L150,135 L120,142 L90,135 Z" fill="url(#darkArmor)" stroke="#475569" stroke-width="1.5"/>
    <!-- Yellow Crown & Crest -->
    <path d="M92,96 L148,96 L142,75 L120,68 L98,75 Z" fill="url(#goldPlate)"/>
    <polygon points="120,60 126,80 114,80" fill="#FCD34D"/>
    <!-- Cheeks Armor -->
    <polygon points="78,105 92,98 90,128 80,122" fill="url(#goldPlate)"/>
    <polygon points="162,105 148,98 150,128 160,122" fill="url(#goldPlate)"/>
    <!-- Central Head Visor Bar -->
    <rect x="117" y="80" width="6" height="35" fill="#0F172A"/>

    <!-- Optic Eyes (Glowing Cyan with Scanning Pulse) -->
    <g filter="url(#neon)">
      <polygon points="98,107 114,107 110,116 100,116" fill="url(#glowCyan)">
        <animate attributeName="opacity" values="0.85;1;0.85" dur="1.2s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="126,107 142,107 140,116 130,116" fill="url(#glowCyan)">
        <animate attributeName="opacity" values="0.85;1;0.85" dur="1.2s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- Mouthplate / Vocabulator -->
    <polygon points="106,124 134,124 128,136 112,136" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <line x1="112" y1="128" x2="128" y2="128" stroke="#22D3EE" stroke-width="1.5" opacity="0.8"/>
    <line x1="114" y1="132" x2="126" y2="132" stroke="#22D3EE" stroke-width="1.5" opacity="0.6"/>

    <!-- Left Arm (Resting) -->
    <path d="M72,150 L58,185 L70,190 L80,158 Z" fill="url(#goldPlate)"/>

    <!-- Right Arm (Animated Greeting Wave) -->
    <g id="waving-arm">
      <!-- Pivot near right shoulder at (165, 150) -->
      <animateTransform attributeName="transform" type="rotate"
        values="0 165 150; -25 165 150; 8 165 150; -25 165 150; 0 165 150"
        dur="2s" repeatCount="indefinite" ease="ease-in-out"/>
      <!-- Bicep -->
      <path d="M165,148 L190,130 L198,140 L173,158 Z" fill="url(#goldPlate)"/>
      <!-- Forearm & Hand raised in wave -->
      <path d="M190,130 L205,95 L218,102 L200,140 Z" fill="url(#darkArmor)" stroke="#475569" stroke-width="1"/>
      <polygon points="205,95 212,82 224,90 218,102" fill="url(#goldPlate)"/>
      <!-- Fingers wave -->
      <line x1="212" y1="82" x2="216" y2="72" stroke="#FCD34D" stroke-width="3" stroke-linecap="round"/>
      <line x1="217" y1="84" x2="223" y2="74" stroke="#FCD34D" stroke-width="3" stroke-linecap="round"/>
      <line x1="222" y1="87" x2="228" y2="78" stroke="#FCD34D" stroke-width="3" stroke-linecap="round"/>
      <!-- Energy spark at fingertip -->
      <circle cx="223" cy="74" r="3" fill="#22D3EE" filter="url(#neon)">
        <animate attributeName="r" values="2;5;2" dur="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Status / Unit Indicator -->
  <text x="120" y="222" font-family="'Courier New', monospace" font-size="9" fill="#22D3EE" font-weight="bold" text-anchor="middle" letter-spacing="2">
    BUMBLEBEE // READY
  </text>
  <circle cx="38" cy="219" r="3" fill="#22C55E">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
</svg>
