<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 70" width="260" height="70">
  <defs>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="darkArmor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Capsule Frame -->
  <rect x="2" y="2" width="256" height="66" rx="33" fill="#060913" stroke="#22D3EE" stroke-width="1.2" opacity="0.8"/>

  <!-- Bumblebee Mini-Bust with Tilting Animation -->
  <g transform="translate(36, 35)">
    <!-- Tilting Animation -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0; 8; 0; -8; 0" dur="3s" repeatCount="indefinite" ease="ease-in-out"/>

      <!-- Head Base -->
      <path d="M-18,-8 L18,-8 L15,12 L0,18 L-15,12 Z" fill="url(#darkArmor)" stroke="#475569" stroke-width="1"/>
      <!-- Crown -->
      <path d="M-14,-10 L14,-10 L12,-22 L0,-25 L-12,-22 Z" fill="url(#goldPlate)"/>
      <polygon points="0,-27 4,-20 -4,-20" fill="#FCD34D"/>
      <!-- Cheeks -->
      <polygon points="-22,-5 -15,-9 -14,8 -20,5" fill="url(#goldPlate)"/>
      <polygon points="22,-5 15,-9 14,8 20,5" fill="url(#goldPlate)"/>

      <!-- Glowing Optic Eyes (Tilting Scanner) -->
      <polygon points="-12,-2 -4,-2 -5,3 -11,3" fill="#22D3EE" filter="url(#neon)">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="4,-2 12,-2 11,3 5,3" fill="#22D3EE" filter="url(#neon)">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
      </polygon>
      <!-- Vocabulator -->
      <line x1="-6" y1="9" x2="6" y2="9" stroke="#22D3EE" stroke-width="1.2"/>
      <line x1="-4" y1="12" x2="4" y2="12" stroke="#22D3EE" stroke-width="1.2" opacity="0.7"/>
    </g>
  </g>

  <!-- Telemetry Text & Animated Equalizer -->
  <g transform="translate(78, 18)">
    <text x="0" y="12" font-family="'Courier New', monospace" font-size="10.5" fill="#FCD34D" font-weight="bold" letter-spacing="1.5">
      BUMBLEBEE // SCAN
    </text>
    <text x="0" y="26" font-family="'Courier New', monospace" font-size="8" fill="#94A3B8" letter-spacing="1">
      COGNITIVE ARCHITECT
    </text>
    <text x="0" y="38" font-family="'Courier New', monospace" font-size="7.5" fill="#22D3EE">
      MODE: TACTICAL DOCK [OK]
    </text>
  </g>

  <!-- Live Pulse Dot -->
  <circle cx="236" cy="35" r="4" fill="#22C55E">
    <animate attributeName="r" values="3;5;3" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.2s" repeatCount="indefinite"/>
  </circle>
</svg>
